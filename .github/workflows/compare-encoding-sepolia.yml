---
name: compare-encoding-sepolia

'on':
  pull_request:
    paths:
      - '**.rs'
      - '**.ts'
      - '**Cargo**'
      - '**package*.json'
      - '.github/workflows/compare-encoding-*.yml'
  schedule:
    - cron: '12 */12 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  setup:
    runs-on: ubuntu-26.04
    outputs:
      # vvv how long to keep encoding blocks
      timeout-minutes: ${{ steps.cron-env.outputs.timeout-minutes || 1 }}
      step-timeout: ${{ steps.cron-env.outputs.step-timeout || 3 }}
      # ^^^ how long to wait for the encoding-blocks program to exit
      # WARNING: must be greater than the value of `timeout-minutes`

    steps:
      - name: Cron ENV
        id: cron-env
        if: github.event_name == 'schedule'
        run: |
          # shellcheck disable=SC2129
          echo "timeout-minutes=3" >> "$GITHUB_OUTPUT"
          echo "step-timeout=5" >> "$GITHUB_OUTPUT"

  alloy-encode:
    needs:
      - setup
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure rustc version
        run: |
          RUSTC_VERSION=$(grep channel rust/rust-toolchain.toml | tail -n1 | tr -d " " | cut -f2 -d'"')
          echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTC_VERSION }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        working-directory: rust
        run: |
          cargo build --release

      - name: DEBUG - Print runner IP address
        run: |
          # see https://opensource.com/article/18/5/how-find-ip-address-linux
          IP_ADDRESS=$(curl https://ifconfig.me)
          echo "INFO: IP_ADDRESS=$IP_ADDRESS"

      - name: Execute for ${{ needs.setup.outputs.timeout-minutes }} minutes
        timeout-minutes: ${{ fromJSON(needs.setup.outputs.step-timeout) }}
        working-directory: rust
        run: |
          ./target/release/encode-blocks \
            --eth-rpc-url wss://cold-burned-log.ethereum-sepolia.quiknode.pro/${{ secrets.QUICKNODE_SEPOLIA_RPC_KEY }} \
            --path-to-store-json /var/tmp/encoded-data/alloy/
        env:
          TIMEOUT_MINUTES: ${{ needs.setup.outputs.timeout-minutes }}
          # QuickNode's plan limit is shared with production RPC traffic and with
          # the other compare-encoding workflow, so keep each job well under it.
          RPC_MAX_REQUESTS_PER_SECOND: 25

      - name: Add notices in case of failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          # note: GitHub appears to display these in reverse order
          echo "::notice::SUGGESTION: Trigger this workflow manually against the same branch to verify the changes."
          echo "::notice::IMPORTANT:  Secret credentials may be missing for PRs from Dependabot!"

      - name: Report result to Slack
        if: failure() && github.event_name == 'schedule'
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
          channel: '#protocol-internal'
          message: 'Sepolia: Alloy encoding failed! cc <!subteam^S028FDV6CCV>'

      - name: Upload encoded data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: encoded-by-alloy
          path: /var/tmp/encoded-data/alloy
          include-hidden-files: true

  ethers-encode:
    needs:
      - setup
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present

      - name: DEBUG - Print runner IP address
        run: |
          # see https://opensource.com/article/18/5/how-find-ip-address-linux
          IP_ADDRESS=$(curl https://ifconfig.me)
          echo "INFO: IP_ADDRESS=$IP_ADDRESS"

      - name: Execute for ${{ needs.setup.outputs.timeout-minutes }} minutes
        timeout-minutes: ${{ fromJSON(needs.setup.outputs.step-timeout) }}
        run: |
          set -o pipefail
          node dist/bin/encode-blocks.js \
            wss://sepolia.infura.io/ws/v3/${{ secrets.INFURA_SEPOLIA_RPC_KEY }} \
            /var/tmp/encoded-data/ethers/ \
            2>&1 | tee /var/tmp/ethers-encode.log
        env:
          TIMEOUT_MINUTES: ${{ needs.setup.outputs.timeout-minutes }}

      - name: Fail on MAX_ENCODED_SIZE errors
        if: always()
        run: |
          if [ ! -f /var/tmp/ethers-encode.log ]; then
            echo "::error::encode log not found — cannot verify MAX_ENCODED_SIZE"
            exit 1
          fi
          if grep -q 'MAX_ENCODED_SIZE' /var/tmp/ethers-encode.log; then
            echo "::error::One or more blocks exceeded MAX_ENCODED_SIZE and were silently skipped:"
            grep 'MAX_ENCODED_SIZE' /var/tmp/ethers-encode.log
            exit 1
          fi
          echo "No MAX_ENCODED_SIZE errors detected."

      - name: Add notices in case of failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          # note: GitHub appears to display these in reverse order
          echo "::notice::SUGGESTION: Trigger this workflow manually against the same branch to verify the changes."
          echo "::notice::IMPORTANT:  Secret credentials may be missing for PRs from Dependabot!"

      - name: Report result to Slack
        if: failure() && github.event_name == 'schedule'
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
          channel: '#protocol-internal'
          message: 'Sepolia: Ethers encoding failed! cc <!subteam^S028FDV6CCV>'

      - name: Upload encoded data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: encoded-by-ethers
          path: /var/tmp/encoded-data/ethers
          include-hidden-files: true

  compare-data:
    needs:
      - alloy-encode
      - ethers-encode
    runs-on: ubuntu-26.04
    steps:
      - name: Setup
        run: |
          sudo apt-get install colordiff unzip

      - name: Download encoded data from alloy
        uses: actions/download-artifact@v8
        with:
          path: /var/tmp/encoded-data
          pattern: encoded-by-alloy

      - name: Git commit alloy data
        working-directory: /var/tmp/encoded-data
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "creditcoin@gluwa.com"
          git config --global user.name "gluwa-bot"

          git init
          git add .
          git commit -a -m "Import data encoded by alloy"

          # remove everything b/c next we'll import the data from ethers encoding
          rm -rf *

      - name: Download encoded data from ethers
        uses: actions/download-artifact@v8
        with:
          path: /var/tmp/encoded-data
          pattern: encoded-by-ethers

      - name: Compare
        working-directory: /var/tmp/encoded-data
        timeout-minutes: 5
        run: |
          git status

          set -eo pipefail
          # filter only modified content b/c between the 2 CI jobs we may not have
          # encoded exactly the same set of blocks. Especially if cargo needs to
          # recompile from scratch
          git diff --diff-filter=M | colordiff

          # will exit non-zero in case of differences
          git diff --quiet --diff-filter=M

      - name: Report result to Slack
        if: failure() && github.event_name == 'schedule'
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
          channel: '#protocol-internal'
          message: 'Sepolia: encoding comparison failed! cc <!subteam^S028FDV6CCV>'

  decode-transactions:
    needs:
      - ethers-encode
    # Run even if ethers-encode "failed" (e.g. the MAX_ENCODED_SIZE guard tripped).
    # decode-transactions only consumes the uploaded encoded-by-ethers artifact,
    # which is uploaded with `if: always()`, so it can still run and decode the
    # blocks that were produced. !cancelled() keeps manual/cancel behaviour intact.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    # Both source-chain workflows decode against the same devnet RPC quota.
    concurrency:
      group: compare-encoding-devnet-decode-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run build --if-present

      - name: Download encoded data from ethers
        uses: actions/download-artifact@v8
        with:
          path: /var/tmp/encoded-data
          pattern: encoded-by-ethers

      - name: Decode transactions
        id: decode
        # the script paces itself against the RPC quota, so bound the step in
        # case it ends up crawling at the widest pace
        timeout-minutes: 10
        run: |
          node dist/bin/decode-blocks.js \
            wss://rpc.cc3-devnet.creditcoin.network \
            https://prover.cc3-devnet.creditcoin.network \
            0xf882f3a71A36E29E86615B7055f42A68D7E4cfBB \
            /var/tmp/encoded-data/ \
            1 \
            150

      - name: Report result to Slack
        if: failure() && github.event_name == 'schedule'
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
          channel: '#protocol-internal'
          message: 'Sepolia: decoding/proof/gas check failed on devnet! cc <!subteam^S028FDV6CCV>'
